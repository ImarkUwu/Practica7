services:
  app:
    build: .
    container_name: php-app
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: usuario
      DB_PASS: clave123
      DB_NAME: practica
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: practica
      MYSQL_USER: usuario
      MYSQL_PASSWORD: clave123
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: